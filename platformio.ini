; agri-co2-burner — M5 AtomHub Switch (K042) CO2-dosing controller for a
;   Shizuoka Seiki CG-1000 CO2 generator.
;
; Hardware
;   - M5Stack AtomHub Switch (K042): ATOM Lite (ESP32) + 2x relay AC250V/10A
;       RELAY1 = GPIO22 (active HIGH) → CG-1000 burner enable contact
;       RELAY2 = GPIO19 (spare)
;   - Status LED  = onboard WS2812 on G27
;   - Button      = onboard on G39 (cycles AUTO / FORCE OFF / FORCE ON)
;   - Spare I/O   : PORT.A I2C (G26/G32), RS485 (SP485EE) — for a future
;                   local CO2/temp sensor so the node can dose fully offline.
;
; This is a WiFi node (AC-DC powered, NOT ATOM PoE) — the agri-* WiFi
; exception. Core's W5500 agri::Network is unused; WiFi is brought up in
; main.cpp. First flash over USB-C; later flashes over WiFi via ArduinoOTA
; (discovered as agri-co2-XX) or the /ota web upload page.

[env:m5atom-switch]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atom
framework = arduino
; WiFi + HTTPClient + TLS (GitHub OTA) + WebUI fill the default 1.25 MB app
; slot to 99.5%. min_spiffs gives two 1.9 MB app slots (still dual-OTA-capable)
; with real headroom.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; CH9102F on the ATOM is unreliable above 115200 on Linux — keep it pinned.
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
	; Pulls in ArduinoJson / PubSubClient / FastLED transitively, plus the
	; CommonConfig / MQTT / WebUI / OTA / LED helpers this sketch reuses.
	https://github.com/yasunorioi/agri-node-poe-core.git
